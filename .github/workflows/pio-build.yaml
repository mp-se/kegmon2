name: PlatformIO CI

on:
  pull_request:
  push:
    branches:
      - dev

jobs:
  vue-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Set build metadata
        working-directory: ui
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git fetch --tags
          REV=`git rev-parse HEAD | rev | cut -c 1-6 | rev`
          TAG=`git tag --sort=creatordate | tail -1`
          echo "VITE_APP_BUILD=..$REV" >> .env
          echo "VITE_APP_VERSION=$TAG" >> .env
          cat .env

      - name: Build UI
        working-directory: ui
        run: |
          rm -rf node_modules package-lock.json
          npm install
          npm run build

      - name: Upload UI dist
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/assets/

  pio-build:
    runs-on: ubuntu-latest
    needs: vue-build
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download UI dist
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/assets/

      - name: Copy UI assets to html
        run: |
          cp ui/dist/assets/style.css.gz html/app.css.gz
          cp ui/dist/assets/index.js.gz html/app.js.gz

      - name: Setup PlatformIO
        uses: n-vr/setup-platformio-action@v1.0.1

      - name: PlatformIO Run
        uses: karniv00l/platformio-run-action@v1
        with:
          environments: "kegmon-esp32s3-pro-tft-sd,kegmon-esp32s3-pro-tft-9488-sd,kegmon-esp32s3-pro-tft-9341-sd"
          jobs: 6
          silent: false
          verbose: true
          disable-auto-clean: false

      - uses: EndBug/add-and-commit@v9
        if: ${{ github.event_name != 'pull_request' }}
        with:
          add: 'bin html'
          author_name: GitHub Action
          author_email: mp-se@noreply.github.com
          default_author: github_actor
          message: 'GitHub Action Build'
          pathspec_error_handling: ignore
